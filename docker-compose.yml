services:
  backend:
    build:
      context: ./apitracker
      dockerfile: Dockerfile
    container_name: minitracker-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=*
    networks:
      - minitracker-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
    container_name: minitracker-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - minitracker-net

networks:
  minitracker-net:
    driver: bridge
